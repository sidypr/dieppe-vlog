services:
  - type: web
    name: dieppe-vlog
    env: docker
    dockerfilePath: ./Dockerfile
    buildCommand: |
      curl -sS https://getcomposer.org/installer | php
      php composer.phar install --no-interaction --prefer-dist --optimize-autoloader
    startCommand: docker-compose up
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: dieppe-vlog-db
          property: connectionString
    disk:
      name: uploads
      mountPath: /var/www/html/public/uploads
      sizeGB: 1

databases:
  - name: dieppe-vlog-db
    plan: free

disks:
  - name: uploads
    mountPath: /var/www/html/public/uploads
    sizeGB: 1 