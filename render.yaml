services:
  - type: web
    name: dieppe-vlog
    env: docker
    dockerfilePath: Dockerfile
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dieppe-vlog-db
          property: connectionString

databases:
  - name: dieppe-vlog-db
    plan: free 