services:
  - type: web
    name: dieppe-vlog
    env: php
    buildCommand: ./build.sh
    startCommand: php -S 0.0.0.0:$PORT -t public/
    envVars:
      - key: APP_ENV
        value: prod
      - key: APP_DEBUG
        value: "0"
      - key: DATABASE_URL
        fromDatabase:
          name: dieppe-vlog-db
          property: connectionString

databases:
  - name: dieppe-vlog-db
    plan: free 