name: app

type: php:8.2

runtime:
    extensions:
        - apcu
        - mbstring
        - pdo_pgsql
        - iconv
        - ctype
        - opcache

build:
    flavor: none

dependencies:
    php:
        composer/composer: "^2"

relationships:
    database: "db:postgresql"

web:
    locations:
        "/":
            root: "public"
            expires: 1h
            passthru: "/index.php"
            allow: true
            rules:
                \.(css|js|gif|jpe?g|png|ttf|eot|woff2?|otf|ico|svg?)$:
                    allow: true
                ^/uploads/:
                    allow: true
                    expires: 1h
                    scripts: false

variables:
    php:
        memory_limit: 256M
        upload_max_filesize: 64M
        post_max_size: 64M

disk: 2048

mounts:
    "/var": { source: local, source_path: var }
    "/public/uploads": { source: local, source_path: uploads }

hooks:
    build: |
        set -e
        composer install --no-dev --optimize-autoloader
        php bin/console cache:clear
        php bin/console assets:install --no-debug
    deploy: |
        set -e
        mkdir -p public/uploads
        php bin/console doctrine:migrations:migrate --no-interaction
        php bin/console cache:clear 